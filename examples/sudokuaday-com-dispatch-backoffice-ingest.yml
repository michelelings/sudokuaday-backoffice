# Copy to: jipvandervelde/sudokuaday.com → .github/workflows/dispatch-backoffice-ingest.yml
#
# When `main` changes, tell the backoffice repo to run its ingest workflow (clone this site repo,
# refresh parity-snapshot.json, push, then optional Vercel hook).
#
# On sudokuaday.com, add Actions secret:
#   BACKOFFICE_REPO_DISPATCH_PAT
# — a PAT that can create repository_dispatch on michelelings/sudokuaday-backoffice.
#   Classic: `repo` scope (target repo: backoffice), or fine-grained: Contents: Read and write
#   on michelelings/sudokuaday-backoffice only (Metadata read).

name: Dispatch backoffice ingest

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository dispatch to backoffice
        env:
          TOKEN: ${{ secrets.BACKOFFICE_REPO_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo '::error::Set secret BACKOFFICE_REPO_DISPATCH_PAT on this repo (see examples/sudokuaday-com-dispatch-backoffice-ingest.yml in backoffice).'
            exit 1
          fi
          curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/michelelings/sudokuaday-backoffice/dispatches \
            -d '{"event_type":"sudokuaday-site-updated","client_payload":{}}'
